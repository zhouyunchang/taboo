# From repository root: docker compose -f deploy/compose.postgres.yml up -d --build
# Set POSTGRES_PASSWORD, TABOO_CONTROL_PASSWORD, TABOO_MASTER_KEY, TABOO_JWT_SECRET.
# TABOO_CONTROL_PASSWORD must be URI-safe (e.g. openssl rand -hex 32).
name: taboo-standard
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taboo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a database administrator password}
      TABOO_CONTROL_PASSWORD: ${TABOO_CONTROL_PASSWORD:?set a URI-safe application password}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/initialize.sh:/docker-entrypoint-initdb.d/initialize.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d taboo']
      interval: 3s
      retries: 30
    restart: unless-stopped
  taboo:
    build:
      context: ..
      dockerfile: apps/server-go/Dockerfile
    ports: ['127.0.0.1:${TABOO_HTTP_PORT:-7100}:7100']
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      TABOO_DATABASE_URL: postgres://taboo_control:${TABOO_CONTROL_PASSWORD:?required}@postgres:5432/taboo?sslmode=disable
      TABOO_DATABASE_RUNTIME_ROLE: taboo_runtime
      TABOO_MASTER_KEY: ${TABOO_MASTER_KEY:?set the shared encryption root}
      TABOO_JWT_SECRET: ${TABOO_JWT_SECRET:?set the shared session signing key}
      TABOO_DATA_DIR: /data
      TABOO_PUBLIC_ORIGIN: ${TABOO_PUBLIC_ORIGIN:-http://127.0.0.1:7100}
      TABOO_CORS_ORIGIN: ${TABOO_PUBLIC_ORIGIN:-http://127.0.0.1:7100}
      TABOO_ISSUER_ALLOWLIST: ${TABOO_ISSUER_ALLOWLIST:-}
      TABOO_DISABLE_REGISTER: ${TABOO_DISABLE_REGISTER:-false}
      TABOO_DISABLE_PASSWORD: ${TABOO_DISABLE_PASSWORD:-false}
      TABOO_OIDC_ORG: ${TABOO_OIDC_ORG:-}
      TABOO_OIDC_ISSUER: ${TABOO_OIDC_ISSUER:-}
      TABOO_OIDC_CLIENT_ID: ${TABOO_OIDC_CLIENT_ID:-}
      TABOO_OIDC_CLIENT_SECRET: ${TABOO_OIDC_CLIENT_SECRET:-}
    volumes: ['export-data:/data']
    restart: unless-stopped
volumes:
  postgres-data:
  export-data:
