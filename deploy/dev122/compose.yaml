# taboo on dev122: joins the shared `swetcc` network, uses the shared PostgreSQL 18
# (TLS verify-full) and is published through Nginx Proxy Manager as taboo-dev122.swetcc.com.
# Secrets live only in ./.env on dev122 (0600), generated by deploy.sh; never commit it.
name: taboo
services:
  taboo:
    image: ${TABOO_IMAGE:?set TABOO_IMAGE to a fixed image tag or ID}
    container_name: taboo
    restart: unless-stopped
    env_file: [.env]
    environment:
      TABOO_PORT: "7100"
      TABOO_DATA_DIR: /data
      TABOO_DATABASE_RUNTIME_ROLE: taboo_runtime
    ports: ["127.0.0.1:${TABOO_HTTP_PORT:-7100}:7100"]
    volumes:
      - taboo_data:/data
      - ${TABOO_PG_CA:-/var/snap/docker/common/swetcc-dev/infra/tls/ca.crt}:/etc/taboo/pg-ca.crt:ro
    networks:
      swetcc:
        aliases: [taboo]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:7100/api/v1/readyz >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
networks:
  swetcc:
    external: true
volumes:
  taboo_data:
    name: taboo_data
