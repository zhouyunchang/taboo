# 本机调试用基础设施（不含 taboo 应用本身）
#
#   # 先在仓库根目录准备 .env（见下方变量），然后：
#   docker compose -f deploy/compose.local-infra.yml --env-file .env up -d
#
# 应用在宿主机跑：
#   $env:TABOO_DATABASE_URL = ...（见 .env）
#   npm run dev
#
# 端口避开本机已占用的 5432（其它项目的 PG）。
name: taboo-local

services:
  postgres:
    image: postgres:18-alpine
    container_name: taboo-postgres
    environment:
      POSTGRES_DB: taboo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TABOO_CONTROL_PASSWORD: ${TABOO_CONTROL_PASSWORD:?set TABOO_CONTROL_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - taboo-local-pg:/var/lib/postgresql
      - ./postgres/initialize.sh:/docker-entrypoint-initdb.d/initialize.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d taboo"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  # 动态密钥引擎联调目标库（可选；不需要时可 docker compose stop mysql）
  mysql:
    image: mysql:8.4
    container_name: taboo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mockdb
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - taboo-local-mysql:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -uroot, "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

volumes:
  taboo-local-pg:
  taboo-local-mysql:
