<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>taboo · 禁制 — 密钥管理平台</title>
    <meta name="theme-color" content="#0a0907" />
    <!-- 首帧前定主题：样式表在模块脚本之后加载，先把 data-theme 落好，避免亮暗闪烁。
         只读 localStorage → 解析 → 写两个 data 属性，不依赖 CSS 变量，逻辑与 src/design/theme.ts 一致。 -->
    <script>
      (function () {
        var mode = 'system';
        try {
          var saved = localStorage.getItem('taboo:theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') mode = saved;
        } catch (e) { /* 隐私模式下读不到：按 system */ }
        var dark = true;
        if (mode === 'system') {
          try {
            dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (e) { dark = true; }
        } else {
          dark = mode === 'dark';
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.setAttribute('data-theme-mode', mode);
        // 移动端浏览器 chrome 的底色：与 styles.css 的 --meta-theme-color 同值，
        // 首帧即对齐，避免亮色主题下地址栏先闪一下墨色。
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0a0907' : '#f7f4ec');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
