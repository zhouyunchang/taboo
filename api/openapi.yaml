# taboo（禁制）OpenAPI 3.1 契约 —— 前后端与 SDK 的唯一事实源（M3 #7）
# 约定：
#   - 错误统一 {code, message, details}；Bearer 鉴权；写路径支持 Idempotency-Key 头（幂等约定，v1.5 强制）
#   - 审计类列表为 cursor 分页预留（当前 limit/offset 兼容实现）
openapi: 3.1.0
info:
  title: taboo · 禁制 — 密钥管理平台 API
  version: 0.7.0
  description: 开源自部署密钥管理平台。高价值数据 + 严格访问控制 + 全程留痕。M5：Secret Sync / Webhooks / OIDC SSO / 审计导出。
servers:
  - url: http://localhost:7100
    description: 本地开发
tags:
  - { name: auth, description: 认证（注册/登录/refresh/TOTP 2FA） }
  - { name: orgs, description: 组织 / 项目 / 环境 / 审计 }
  - { name: secrets, description: 密钥 CRUD / 版本 / 回滚 / 导出 }
  - { name: folders, description: 多级文件夹（物化路径 /a/b/） }
  - { name: identities, description: 机器身份（client_credentials + 显式 scope） }
  - { name: sync, description: Secret Sync 外部平台推送（GitHub Actions / Vercel / Cloudflare） }
  - { name: webhooks, description: 密钥变更事件 Webhook（HMAC-SHA256 签名） }
  - { name: sso, description: 外部用户源 / OIDC Realm（Keycloak 等，JIT 入组 + 组角色映射） }
  - { name: members, description: 组织成员 / 邀请 / 项目授权矩阵 }

paths:
  /api/v1/healthz:
    get:
      tags: [orgs]
      summary: 进程存活
      operationId: healthz
      responses:
        '200': { description: 进程活着 }
  /api/v1/readyz:
    get:
      tags: [orgs]
      summary: 就绪（SELECT 1 + schema 版本）
      operationId: readyz
      responses:
        '200': { description: 就绪 }
        '503': { description: DB 或 schema 异常 }
  /api/v1/auth/sources:
    get:
      tags: [sso]
      summary: 登录页 Realm 列表（仅 public_login 的 IdP）以及本地注册/密码是否开放
      operationId: listAuthSources
      responses:
        '200':
          description: 登录选项
          content:
            application/json:
              schema:
                type: object
                properties:
                  register_enabled: { type: boolean }
                  password_enabled: { type: boolean }
                  sources:
                    type: array
                    items: { $ref: '#/components/schemas/AuthSource' }
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: 注册（自动创建个人组织 + 默认项目 + dev/staging/prod）
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: 注册成功, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录（限流 5 次/分钟/IP）；已开 2FA 返回 totp_required + challenge
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功（或需二次验证）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 token（旋转：旧 refresh 立即失效）
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties: { refresh: { type: string } }
      responses:
        '200': { description: 新 token 对, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/totp/setup:
    post:
      tags: [auth]
      summary: 生成 TOTP 待激活密钥（返回 secret / otpauth URL / 二维码 PNG）
      operationId: totpSetup
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 待激活密钥（secret 明文仅此一次展示）
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, example: JBSWY3DPEHPK3PXP }
                  otpauth_url: { type: string, format: uri }
                  qr_png: { type: string, description: data:image/png;base64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/totp/verify:
    post:
      tags: [auth]
      summary: 校验动态码并激活 2FA（签发 10 个恢复码，仅展示一次）
      operationId: totpVerify
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string, example: '123456' } }
      responses:
        '200':
          description: 已开启
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, example: true }
                  recovery_codes: { type: array, items: { type: string, example: abcde-fghi-jklmn } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/totp/disable:
    post:
      tags: [auth]
      summary: 关闭 2FA（需密码确认，恢复码一并作废）
      operationId: totpDisable
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties: { password: { type: string, format: password } }
      responses:
        '200': { description: 已关闭, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean, example: false } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/totp/login:
    post:
      tags: [auth]
      summary: 2FA 第二步：challenge + 动态码/恢复码 → 换正式 token（限流）
      operationId: totpLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge: { type: string, description: login 返回的 5min JWT }
                code: { type: string, description: 6 位动态码或 xxxx-xxx-xxxx 恢复码 }
      responses:
        '200': { description: 登录成功, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/me:
    get:
      tags: [orgs]
      summary: 当前用户 + 组织列表 + 2FA 状态
      operationId: me
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  orgs: { type: array, items: { $ref: '#/components/schemas/OrgMembership' } }
                  totp_enabled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/orgs/{slug}/projects:
    get:
      tags: [orgs]
      summary: 组织项目列表
      operationId: listProjects
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgSlug' }]
      responses:
        '200': { description: 项目列表, content: { application/json: { schema: { type: object, properties: { projects: { type: array, items: { $ref: '#/components/schemas/Project' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [orgs]
      summary: 新建项目（自动建 dev/staging/prod + 根文件夹）
      operationId: createProject
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgSlug' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string } }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/orgs/{slug}/audit:
    get:
      tags: [orgs]
      summary: 审计日志（append-only）
      operationId: audit
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: before, in: query, schema: { type: string }, description: cursor 分页预留（当前按时间倒序 limit） }
        - { name: action, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: 审计记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/orgs/{slug}/audit/verify:
    get:
      tags: [orgs]
      summary: 验真审计哈希链与 checkpoint
      operationId: verifyAudit
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgSlug' }]
      responses:
        '200':
          description: 验真结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  checked: { type: integer }
                  broken_at: { type: string }
                  checkpoint_ok: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/orgs/{slug}/members:
    get:
      tags: [members]
      summary: 成员列表（owner）
      operationId: listMembers
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgSlug' }]
      responses:
        '200':
          description: 成员
          content:
            application/json:
              schema:
                type: object
                properties:
                  members: { type: array, items: { $ref: '#/components/schemas/OrgMember' } }
    post:
      tags: [members]
      summary: 添加已注册用户为成员
      operationId: addMember
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgSlug' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                role: { type: string, enum: [owner, admin, developer, viewer] }
                restricted: { type: boolean }
      responses:
        '201': { description: 已添加 }
  /api/v1/orgs/{slug}/members/{userId}:
    patch:
      tags: [members]
      summary: 改角色 / restricted
      operationId: patchMember
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [owner, admin, developer, viewer] }
                restricted: { type: boolean }
      responses:
        '200': { description: 已更新 }
    delete:
      tags: [members]
      summary: 移除成员
      operationId: removeMember
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已移除 }
  /api/v1/orgs/{slug}/members/{userId}/grants:
    put:
      tags: [members]
      summary: 替换项目授权矩阵
      operationId: putMemberGrants
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grants:
                  type: array
                  items:
                    type: object
                    properties:
                      project_id: { type: string }
                      role: { type: string }
      responses:
        '200': { description: 已更新 }
  /api/v1/orgs/{slug}/invites:
    post:
      tags: [members]
      summary: 创建邀请（自托管返回一次性链接）
      operationId: createInvite
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgSlug' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                role: { type: string, enum: [owner, admin, developer, viewer] }
      responses:
        '201':
          description: 邀请链接
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  url: { type: string }
                  token: { type: string }
                  expires_at: { type: integer }
  /api/v1/invites/{token}/accept:
    post:
      tags: [members]
      summary: 接受邀请（登录用户邮箱须匹配）
      operationId: acceptInvite
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已加入 }
  /api/v1/orgs/{slug}/identities:
    get:
      tags: [identities]
      summary: 机器身份列表（owner/admin）
      operationId: listIdentities
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgSlug' }]
      responses:
        '200': { description: 身份列表, content: { application/json: { schema: { type: object, properties: { identities: { type: array, items: { $ref: '#/components/schemas/Identity' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [identities]
      summary: 创建机器身份（client_secret 仅此一次返回）
      operationId: createIdentity
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgSlug' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityCreateRequest' }
      responses:
        '201': { description: 已创建（含一次性 client_secret）, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityWithSecret' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/orgs/{slug}/identities/{id}/revoke:
    post:
      tags: [identities]
      summary: 吊销机器身份（token 立即失效）
      operationId: revokeIdentity
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已吊销 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/identities/token:
    post:
      tags: [identities]
      summary: client_credentials 换短期 JWT（限流）
      operationId: identityToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, client_secret]
              properties:
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        '200':
          description: 短期 token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 900 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/projects/{pid}/environments:
    get:
      tags: [orgs]
      summary: 项目环境列表
      operationId: listEnvs
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Pid' }]
      responses:
        '200': { description: 环境列表, content: { application/json: { schema: { type: object, properties: { environments: { type: array, items: { $ref: '#/components/schemas/Environment' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [orgs]
      summary: 新建环境（自动建根文件夹）
      operationId: createEnv
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Pid' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string } }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Environment' } } } }
  /api/v1/projects/{pid}/folders:
    get:
      tags: [folders]
      summary: 平铺文件夹列表（前端按 parent_id 建树）
      operationId: listFolders
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Pid' }, { $ref: '#/components/parameters/Env' }]
      responses:
        '200': { description: 文件夹列表, content: { application/json: { schema: { type: object, properties: { folders: { type: array, items: { $ref: '#/components/schemas/Folder' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [folders]
      summary: 创建文件夹（自动补中间节点，幂等）
      operationId: createFolder
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Pid' }, { $ref: '#/components/parameters/Env' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties: { path: { type: string, example: /db/mysql/ } }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { type: object, properties: { id: { type: string }, path: { type: string } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [folders]
      summary: 删除空文件夹（无子目录且无密钥；根目录拒绝）
      operationId: deleteFolder
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Pid' }
        - { $ref: '#/components/parameters/Env' }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 已删除 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{pid}/folders/move:
    post:
      tags: [folders]
      summary: 移动/重命名文件夹（级联更新子孙物化路径与密钥 folder 冗余列）
      operationId: moveFolder
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Pid' }, { $ref: '#/components/parameters/Env' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, example: /db/ }
                to: { type: string, example: /database/ }
      responses:
        '200': { description: 已移动 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{pid}/secrets:
    get:
      tags: [secrets]
      summary: 密钥列表（无值；?path= 按文件夹过滤，缺省全环境）
      operationId: listSecrets
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Pid' }
        - { $ref: '#/components/parameters/Env' }
        - { name: path, in: query, schema: { type: string, description: 物化路径 /a/b/，缺省列出整个环境 } }
      responses:
        '200': { description: 密钥元数据列表, content: { application/json: { schema: { type: object, properties: { secrets: { type: array, items: { $ref: '#/components/schemas/SecretMeta' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [secrets]
      summary: 创建/更新密钥（AES-256-GCM 信封加密，产生新版本；同 key 不同目录互不冲突）
      operationId: upsertSecret
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Pid' }
        - { $ref: '#/components/parameters/Env' }
        - { name: path, in: query, schema: { type: string, default: / } }
        - { name: Idempotency-Key, in: header, schema: { type: string }, description: 幂等约定（v1.5 强制） }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretUpsertRequest' }
      responses:
        '200': { description: 已保存（含新版本号）, content: { application/json: { schema: { type: object, properties: { version: { type: integer } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{pid}/secrets/{key}:
    get:
      tags: [secrets]
      summary: 读取明文（reveal 权限，记审计；?path= 定位目录）
      operationId: revealSecret
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Pid' }
        - { $ref: '#/components/parameters/Env' }
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string, default: / } }
      responses:
        '200': { description: 明文, content: { application/json: { schema: { $ref: '#/components/schemas/SecretValue' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{pid}/secrets/{key}/versions:
    get:
      tags: [secrets]
      summary: 版本历史（只追加）
      operationId: secretVersions
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Pid' }
        - { $ref: '#/components/parameters/Env' }
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string, default: / } }
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions: { type: array, items: { $ref: '#/components/schemas/SecretVersion' } }
                  latest: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{pid}/secrets/{key}/rollback:
    post:
      tags: [secrets]
      summary: 回滚到历史版本（以旧值产生新版本 v+1）
      operationId: rollbackSecret
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Pid' }
        - { $ref: '#/components/parameters/Env' }
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string, default: / } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties: { version: { type: integer } }
      responses:
        '200': { description: 已回滚, content: { application/json: { schema: { type: object, properties: { version: { type: integer } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{pid}/export:
    get:
      tags: [secrets]
      summary: 导出 .env 格式（reveal 权限；值仅出现在响应体）
      operationId: exportSecrets
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Pid' }, { $ref: '#/components/parameters/Env' }]
      responses:
        '200':
          description: text/plain .env 内容
          content:
            text/plain: {}
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{pid}/dynamic-engines:
    get:
      tags: [secrets]
      summary: 动态密钥引擎列表 + 活跃 lease（不含连接串/密码）
      operationId: listDynamicEngines
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Pid' }]
      responses:
        '200':
          description: 引擎与活跃 lease
          content:
            application/json:
              schema:
                type: object
                properties:
                  engines:
                    type: array
                    items: { $ref: '#/components/schemas/DynamicEngine' }
    post:
      tags: [secrets]
      summary: 创建 PostgreSQL 动态密钥引擎（owner/admin；连接串 Master Key 加密落库）
      operationId: createDynamicEngine
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Pid' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DynamicEngineCreateRequest' }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/DynamicEngine' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{pid}/dynamic-engines/{eid}/lease:
    post:
      tags: [secrets]
      summary: 申请动态密钥 lease（仅限机器身份 token，绑定 identity；服务端 CREATE USER ... VALID UNTIL）
      operationId: requestLease
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Pid' }
        - { name: eid, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { ttl: { type: integer, description: 秒，默认引擎 default_ttl，上限 max_ttl } }
      responses:
        '201':
          description: lease 凭证（明文密码仅此一次返回）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaseCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { description: 目标库不可达/授权失败, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/projects/{pid}/dynamic-leases/{lid}/renew:
    post:
      tags: [secrets]
      summary: 续期 lease（延长 VALID UNTIL，不超 max_ttl；lease 所属身份或 owner/admin）
      operationId: renewLease
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Pid' }
        - { name: lid, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { ttl: { type: integer } }
      responses:
        '200': { description: 已续期, content: { application/json: { schema: { type: object, properties: { id: { type: string }, expires_at: { type: integer } } } } } }
        '409': { description: lease 非活跃, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/projects/{pid}/dynamic-leases/{lid}/revoke:
    post:
      tags: [secrets]
      summary: 手动回收 lease（立即 DROP USER；lease 所属身份或 owner/admin）
      operationId: revokeLease
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Pid' }
        - { name: lid, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已回收（或原本非活跃）, content: { application/json: { schema: { type: object, properties: { id: { type: string }, status: { type: string } } } } } }

  # ---------- Secret Sync（M5 #11） ----------
  /api/v1/orgs/{slug}/sync/targets:
    get:
      tags: [sync]
      summary: 同步目标列表（成员可见；config 只回显已配置的键名）
      operationId: listSyncTargets
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
      responses:
        '200':
          description: 目标列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  targets: { type: array, items: { $ref: '#/components/schemas/SyncTarget' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [sync]
      summary: 创建同步目标（owner；平台凭证 Master Key 加密落库；?ping=1 先自检连通性）
      operationId: createSyncTarget
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncTargetInput' }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { type: object, properties: { id: { type: string }, name: { type: string }, platform: { type: string } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/orgs/{slug}/sync/targets/{id}:
    delete:
      tags: [sync]
      summary: 删除同步目标（owner）
      operationId: deleteSyncTarget
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已删除, content: { application/json: { schema: { type: object, properties: { id: { type: string }, deleted: { type: boolean } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{slug}/sync/targets/{id}/retry:
    post:
      tags: [sync]
      summary: 手动全量重推（owner；绑定范围内所有密钥入队）
      operationId: retrySyncTarget
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已入队, content: { application/json: { schema: { type: object, properties: { target_id: { type: string }, enqueued: { type: integer } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{slug}/sync/runs:
    get:
      tags: [sync]
      summary: 同步记录（指纹审计，不含明文；可按目标/状态筛选）
      operationId: listSyncRuns
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, success, failed, dead] } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        '200':
          description: 同步记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs: { type: array, items: { $ref: '#/components/schemas/SyncRun' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------- Webhooks（M5 #12） ----------
  /api/v1/orgs/{slug}/webhooks:
    get:
      tags: [webhooks]
      summary: Webhook 订阅列表（不含签名密钥）
      operationId: listWebhooks
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
      responses:
        '200':
          description: 订阅列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks: { type: array, items: { $ref: '#/components/schemas/Webhook' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [webhooks]
      summary: 创建订阅（owner；secret 缺省自动生成，仅本次响应返回）
      operationId: createWebhook
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                secret: { type: string, description: HMAC 签名密钥（缺省自动生成） }
                events: { type: array, items: { type: string, enum: [secret.created, secret.updated, secret.rolled_back, secret.deleted, '*'] }, description: 空 = 全部事件 }
      responses:
        '201': { description: 已创建（secret 仅此一次返回）, content: { application/json: { schema: { $ref: '#/components/schemas/Webhook' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/orgs/{slug}/webhooks/{id}:
    delete:
      tags: [webhooks]
      summary: 删除订阅（owner）
      operationId: deleteWebhook
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已删除, content: { application/json: { schema: { type: object, properties: { id: { type: string }, deleted: { type: boolean } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/orgs/{slug}/webhooks/{id}/deliveries:
    get:
      tags: [webhooks]
      summary: 投递日志（至少一次 + 指数退避；payload 不含明文）
      operationId: listWebhookDeliveries
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: 投递记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        event: { type: string }
                        status: { type: string, enum: [pending, success, failed, dead] }
                        http_code: { type: integer }
                        attempts: { type: integer }
                        error: { type: string }
                        created_at: { type: string }
                        delivered_at: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------- OIDC SSO（M5 #13） ----------
  /api/v1/auth/oidc/{slug}/login:
    get:
      tags: [sso]
      summary: OIDC 登录入口（302 跳转 IdP；PKCE S256 + nonce；公开，限流保护）
      operationId: oidcLogin
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: pid, in: query, schema: { type: string }, description: 指定 IdP 配置 id；缺省取该组织第一个已启用配置 }
      responses:
        '302': { description: 重定向到 IdP }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/oidc/{slug}/callback:
    get:
      tags: [sso]
      summary: OIDC callback（code 换 id_token，验签 + JIT 入组 + 发本地会话）
      operationId: oidcCallback
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: HTML 中间页：token 写入 localStorage 后跳转 / }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: IdP 不可达/换 token 失败, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/orgs/{slug}/oidc:
    get:
      tags: [sso]
      summary: IdP 配置列表（成员可见；不含 client_secret）
      operationId: listOIDCProviders
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
      responses:
        '200':
          description: 配置列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers: { type: array, items: { $ref: '#/components/schemas/OIDCProvider' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [sso]
      summary: 接入 IdP（owner；创建前做 discovery 连通性自检；client_secret 加密落库）
      operationId: createOIDCProvider
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OIDCProviderInput' }
      responses:
        '201': { description: 已接入, content: { application/json: { schema: { type: object, properties: { id: { type: string }, name: { type: string } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/orgs/{slug}/oidc/{id}:
    patch:
      tags: [sso]
      summary: 更新 IdP 配置（owner；client_secret 可选轮换）
      operationId: updateOIDCProvider
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OIDCProviderInput' }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { type: object, properties: { id: { type: string }, updated: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [sso]
      summary: 删除 IdP 配置（owner）
      operationId: deleteOIDCProvider
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已删除, content: { application/json: { schema: { type: object, properties: { id: { type: string }, deleted: { type: boolean } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------- 审计导出（M5 #14） ----------
  /api/v1/orgs/{slug}/audit/export:
    get:
      tags: [orgs]
      summary: 审计导出 CSV/JSONL（筛选同审计查询；async=1 走异步任务 + 下载链接）
      operationId: auditExport
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: format, in: query, schema: { type: string, enum: [csv, jsonl], default: csv } }
        - { name: action, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: async, in: query, schema: { type: string, enum: ['1'] }, description: 强制异步：返回 202 + download_url }
      responses:
        '200': { description: 导出文件流（CSV/JSONL） }
        '202': { description: 异步任务已创建, content: { application/json: { schema: { type: object, properties: { id: { type: string }, status: { type: string }, download_url: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/orgs/{slug}/audit/exports:
    get:
      tags: [orgs]
      summary: 导出任务列表
      operationId: listAuditExports
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  exports: { type: array, items: { $ref: '#/components/schemas/AuditExport' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/orgs/{slug}/audit/exports/{id}/retry:
    post:
      tags: [orgs]
      summary: 失败的导出任务重试一次
      operationId: retryAuditExport
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已重新入队 }
  /api/v1/orgs/{slug}/audit/exports/{id}:
    get:
      tags: [orgs]
      summary: 下载导出文件（未完成时返回任务状态）
      operationId: downloadAuditExport
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgSlug' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 文件内容或任务状态 JSON }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    OrgSlug: { name: slug, in: path, required: true, schema: { type: string } }
    Pid: { name: pid, in: path, required: true, schema: { type: string } }
    Env: { name: env, in: query, schema: { type: string, default: dev } }
  responses:
    BadRequest: { description: 参数错误, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: 未认证/凭证错误, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: 权限不足（RBAC），如 viewer 取明文、developer 写 prod, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: 资源不存在, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: 冲突（如邮箱已注册）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited: { description: 限流（5 次/分钟/IP，可用 TABOO_LOGIN_RATE_LIMIT 调整）, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      properties:
        code: { type: string, example: BAD_CREDENTIALS }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        kind: { type: string, enum: [user, identity] }
    AuthSource:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        login_url: { type: string }
    OrgMembership:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [owner, admin, developer, viewer] }
        restricted: { type: boolean }
    OrgMember:
      type: object
      properties:
        user_id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, developer, viewer] }
        restricted: { type: boolean }
        joined_at: { type: string }
        grants:
          type: array
          items:
            type: object
            properties:
              project_id: { type: string }
              project_slug: { type: string }
              project_name: { type: string }
              role: { type: string }
    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }
    Environment:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        sort_order: { type: integer }
        protected: { type: boolean }
    Folder:
      type: object
      properties:
        id: { type: string }
        parent_id: { type: string, description: 根目录为空串 }
        name: { type: string }
        path: { type: string, example: /db/mysql/ }
    SecretMeta:
      type: object
      properties:
        id: { type: string }
        folder: { type: string }
        key: { type: string }
        comment: { type: string }
        tags: { type: array, items: { type: string } }
        version: { type: integer }
        updated_at: { type: string }
        canReveal: { type: boolean }
        canWrite: { type: boolean }
    SecretValue:
      allOf:
        - { $ref: '#/components/schemas/SecretMeta' }
        - type: object
          properties: { value: { type: string } }
    SecretVersion:
      type: object
      properties:
        version: { type: integer }
        created_by: { type: string }
        created_at: { type: string }
    SecretUpsertRequest:
      type: object
      required: [key, value]
      properties:
        key: { type: string, pattern: '^[^/\s][^/]*[^/\s]$|^[^/\s]$', description: '单段 key，禁止包含 /（folder 与 key 分离，#16）' }
        value: { type: string }
        comment: { type: string }
        tags: { type: array, items: { type: string } }
    AuditLog:
      type: object
      properties:
        id: { type: string }
        actor_name: { type: string }
        action: { type: string, example: secrets.reveal }
        resource: { type: string }
        metadata: { type: string }
        ip: { type: string }
        created_at: { type: string }
    SyncTarget:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string, enum: [github, vercel, cloudflare] }
        project_id: { type: string }
        env_slug: { type: string, description: "'*' 为全部环境" }
        enabled: { type: boolean }
        created_at: { type: string }
        config_keys: { type: array, items: { type: string }, description: 已配置键名（不含值） }
    SyncTargetInput:
      type: object
      required: [name, platform, config]
      properties:
        name: { type: string }
        platform: { type: string, enum: [github, vercel, cloudflare] }
        project_id: { type: string, description: 缺省 = 组织内全部项目 }
        env_slug: { type: string, default: '*' }
        config:
          type: object
          additionalProperties: { type: string }
          description: |
            github: token/owner/repo/environment?(repo 级留空)；
            vercel: token/project_id/team_id?/targets?(逗号分隔，默认 production)；
            cloudflare: token/account_id/script_name
    SyncRun:
      type: object
      properties:
        id: { type: string }
        target_id: { type: string }
        secret_key: { type: string }
        action: { type: string }
        fingerprint: { type: string, description: 推送内容 sha256 前 16 hex（不含明文） }
        status: { type: string, enum: [pending, success, failed, dead] }
        trigger_type: { type: string, enum: [event, manual] }
        attempts: { type: integer }
        error: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
    Webhook:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        secret: { type: string, description: 仅创建响应返回一次 }
        events: { type: array, items: { type: string } }
        active: { type: boolean }
        created_at: { type: string }
    OIDCProvider:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        issuer: { type: string }
        client_id: { type: string }
        scopes: { type: string }
        role_claim: { type: string }
        username_claim: { type: string }
        role_map: { type: object, additionalProperties: { type: string } }
        default_role: { type: string, enum: [viewer, developer, admin, owner] }
        public_login: { type: boolean, description: 在登录页展示为实例级 Realm }
        autocreate: { type: boolean }
        sync_role: { type: boolean, description: 每次 SSO 登录按组映射同步角色（不降级最后一名 owner） }
        enabled: { type: boolean }
        created_at: { type: string }
        login_url: { type: string }
    OIDCProviderInput:
      type: object
      properties:
        name: { type: string }
        issuer: { type: string, example: https://keycloak.example.com/realms/company }
        client_id: { type: string }
        client_secret: { type: string, description: Master Key 加密落库，不回显；PATCH 时可省略 }
        scopes: { type: string, default: openid,email,profile }
        role_claim: { type: string, default: groups, description: 支持点分路径，如 realm_access.roles }
        username_claim: { type: string, default: email }
        role_map: { type: object, additionalProperties: { type: string }, description: claim 值 → 角色；Keycloak 组路径会匹配末段 }
        default_role: { type: string, default: viewer }
        public_login: { type: boolean, default: true }
        autocreate: { type: boolean, default: true }
        sync_role: { type: boolean, default: true }
        enabled: { type: boolean }
    AuditExport:
      type: object
      properties:
        id: { type: string }
        format: { type: string, enum: [csv, jsonl] }
        status: { type: string, enum: [pending, done, failed] }
        row_count: { type: integer }
        error: { type: string }
        created_at: { type: string }
        completed_at: { type: string }
    IdentityScope:
      type: object
      properties:
        project_id: { type: string }
        project_slug: { type: string }
        env: { type: string, description: 显式环境，禁止通配 }
        permission: { type: string, enum: [read, reveal, write] }
    Identity:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        client_id: { type: string }
        status: { type: string, enum: [active, revoked] }
        token_ttl: { type: integer }
        created_at: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/IdentityScope' } }
    IdentityWithSecret:
      allOf:
        - { $ref: '#/components/schemas/Identity' }
        - type: object
          properties: { client_secret: { type: string, description: 仅此一次展示 } }
    IdentityCreateRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        token_ttl: { type: integer, default: 900, maximum: 3600 }
        scopes:
          type: array
          minItems: 1
          items:
            type: object
            required: [project_id, env, permission]
            properties:
              project_id: { type: string }
              env: { type: string }
              permission: { type: string, enum: [read, reveal, write] }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        name: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    TokenPair:
      type: object
      properties:
        access: { type: string }
        refresh: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, example: 900 }
    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
    DynamicEngine:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, example: postgres }
        database: { type: string }
        default_ttl: { type: integer }
        max_ttl: { type: integer }
        created_at: { type: string }
        leases:
          type: array
          items: { $ref: '#/components/schemas/DynamicLease' }
    DynamicEngineCreateRequest:
      type: object
      required: [name, connection_string]
      properties:
        name: { type: string }
        type: { type: string, enum: [postgres] }
        connection_string: { type: string, description: 高权限连接串（postgres://…），加密落库 }
        database: { type: string, default: postgres }
        default_ttl: { type: integer, default: 3600 }
        max_ttl: { type: integer, default: 86400 }
    DynamicLease:
      type: object
      properties:
        id: { type: string }
        username: { type: string, example: taboo_a1b2c3d4e5f6 }
        status: { type: string, enum: [active, expired, revoked, failed] }
        expires_at: { type: integer }
        seconds_left: { type: integer }
        created_at: { type: string }
    LeaseCredentials:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        password: { type: string, description: 仅此一次明文返回 }
        database: { type: string }
        expires_at: { type: integer }
        seconds_left: { type: integer }
    LoginResponse:
      oneOf:
        - title: 直接登录成功
          allOf: [{ $ref: '#/components/schemas/AuthResponse' }]
        - title: 需要 2FA 二次验证
          type: object
          properties:
            totp_required: { type: boolean, const: true }
            challenge: { type: string }
