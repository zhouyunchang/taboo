# GoReleaser：二进制 + 容器镜像发布，cosign 签名 + SBOM（设计文档 §8 供应链）
version: 2

project_name: taboo

before:
  hooks:
    - npm ci --no-audit --no-fund
    - just web

builds:
  - id: taboo-server
    dir: apps/server-go
    main: ./cmd/server
    binary: taboo-server
    env: [CGO_ENABLED=0]
    ldflags: ["-s", "-w", "-X main.version={{.Version}}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: taboo
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README.md
      - src: docs/*
        dst: docs

checksum:
  name_template: "checksums.txt"

sboms:
  - id: taboo
    artifacts: archive

dockers:
  - id: taboo
    dockerfile: deploy/Dockerfile.release
    ids: [taboo-server]
    goos: linux
    goarch: amd64
    use: docker
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=taboo"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/zhouyunchang/taboo"
    image_templates:
      - "ghcr.io/zhouyunchang/taboo:{{ .Version }}"
      - "ghcr.io/zhouyunchang/taboo:latest"

signs:
  - id: cosign-checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

docker_signs:
  - id: cosign-images
    cmd: cosign
    args: ["sign", "--yes", "${artifact}@${digest}"]
    artifacts: images

release:
  github:
    owner: zhouyunchang
    name: taboo
  draft: true
  prerelease: auto
  name_template: "taboo {{ .Version }}"
  footer: |
    ## 验证

    ```bash
    cosign verify --certificate-identity 'https://github.com/zhouyunchang/taboo/.github/workflows/release.yml@refs/tags/{{ .Tag }}' --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' ghcr.io/zhouyunchang/taboo:{{ .Version }}
    ```
